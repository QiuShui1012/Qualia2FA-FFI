name: CI

# 说明：本仓库根目录是 `FFI/`（crate `qualia2fa-ffi`），所有 job 都在仓库根执行。
#
# 本仓库的关键职责是「边界」而非密码学逻辑，因此 CI 的重点与 Core 不同：
#   1. 确认 FFI 层没有把核心逻辑搬进来（靠人工审查，CI 只能保证它能编译并通过测试）
#   2. 确认绑定生成仍然可用——绑定生成失败会让端侧无法构建，
#      而那要到端侧编译时才会暴露，代价很高
#   3. 确认 unsafe 面没有无声扩大（`unsafe_code = "warn"`，CI 用 -D warnings 上升为错误）

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  # ── 第一关：格式、lint、测试 ────────────────────────────────────────────
  check:
    name: fmt + clippy + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：本仓库以 `path = "Core"` 依赖核心库（见 Cargo.toml 里的说明——
      # 路径**不能**带 `../` 前缀，那种写法解析到的是外层仓库之上，CI 上不存在）。
      #
      # 因此这里把核心检出到**本仓库内**的 `Core/`。这与本地布局一致：
      # 端侧把本仓库当 submodule 引入时，同一位置由 `Main/Core` 提供。
      - name: 取出 qualia2fa-core（满足 path = "Core" 依赖）
        uses: actions/checkout@v4
        with:
          repository: QiuShui1012/Qualia2FA-Core
          path: Core

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # `-D warnings` 会把 `unsafe_code = "warn"` 变成硬错误：
      # 任何新增的 unsafe 都必须在代码审查中被显式讨论，不能悄悄混进来。
      - name: cargo clippy（警告视为错误）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo doc（警告视为错误）
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # ── 第二关：绑定生成必须仍然可用 ────────────────────────────────────────
  # 这一关是端侧构建的前置条件。若绑定生成坏了，端侧会在自己仓库里报错，
  # 定位成本远高于在这里挡住。
  bindgen:
    name: 绑定生成（Kotlin / Swift）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取出 qualia2fa-core（满足 path = "Core" 依赖）
        uses: actions/checkout@v4
        with:
          repository: QiuShui1012/Qualia2FA-Core
          path: Core

      - name: 构建库与绑定生成器
        run: cargo build --locked --bin uniffi-bindgen

      - name: 生成 Kotlin 绑定
        shell: pwsh
        run: |
          # uniffi-bindgen 内部会调用 `cargo metadata`，必须在仓库根执行
          cargo run --bin uniffi-bindgen -- generate `
            --library target/debug/qualia2fa_ffi.dll `
            --language kotlin --out-dir "$env:RUNNER_TEMP/bindings-kotlin"
          # 产物**不**直接在 out-dir 下，而是按 package 名分层：
          #   <out-dir>/uniffi/qualia2fa_ffi/qualia2fa_ffi.kt
          # 因此必须递归查找，不能假设它在顶层。
          $ktFile = Get-ChildItem "$env:RUNNER_TEMP/bindings-kotlin" -Recurse -Filter 'qualia2fa_ffi.kt' |
                    Select-Object -First 1
          if (-not $ktFile) {
            throw "未生成 Kotlin 绑定文件"
          }
          Write-Host "生成: $($ktFile.FullName) ($($ktFile.Length) B)"
          # 关键：绑定的 package 名是端侧 import 的依据，改了会直接破坏端侧编译
          $kt = Get-Content $ktFile.FullName -Raw
          if ($kt -notmatch 'package uniffi\.qualia2fa_ffi') {
            throw "生成的 Kotlin 绑定 package 名不是 uniffi.qualia2fa_ffi"
          }
          # 端侧靠 JNA 加载动态库，这条保证 JVM 路线的前提仍然成立
          if ($kt -notmatch 'import com\.sun\.jna\.') {
            throw "生成的 Kotlin 绑定未使用 JNA，JVM 路线的前提已不成立"
          }

      - name: 生成 Swift 绑定
        shell: pwsh
        run: |
          cargo run --bin uniffi-bindgen -- generate `
            --library target/debug/qualia2fa_ffi.dll `
            --language swift --out-dir "$env:RUNNER_TEMP/bindings-swift"
          $sw = Get-ChildItem "$env:RUNNER_TEMP/bindings-swift" -Recurse -File -ErrorAction SilentlyContinue
          if (-not $sw) {
            throw "未生成 Swift 绑定产物"
          }
          # Swift 侧由三件套组成，缺任何一件都无法被 Xcode 工程引用
          foreach ($ext in @('.swift', '.h', '.modulemap')) {
            if (-not ($sw | Where-Object { $_.Name -like "*$ext" })) {
              throw "Swift 绑定缺少 $ext 产物"
            }
          }
          $sw | ForEach-Object { Write-Host "生成: $($_.Name) ($($_.Length) B)" }
