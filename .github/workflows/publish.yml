name: Publish

# Publishes only on `v*` tags.
#
# Deliberately **not** on pushes to master: publishing to crates.io is
# **irreversible**, and once a version number is taken it exists forever (yank
# only stops new dependency resolution; it does not remove what others already
# downloaded). Publishing must therefore be an explicit action, not a side effect
# of merging to the main branch.
on:
  push:
    tags:
      - 'v*'
  # Allows one manual dry-run to inspect the packaged result without publishing.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Verify first: the version in the tag must match Cargo.toml, and packaging must
  # succeed on every target platform.
  #
  # Why **every** target platform: `cargo publish` only checks the build for the
  # current platform by default, so a package that builds on Linux can fail to
  # package on Windows because of a wrong path in a `cfg` branch -- and by then the
  # version number is already spent.
  verify:
    name: Verify packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $manifest in Cargo.toml"
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    # A manual trigger (workflow_dispatch) only runs verification, never publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `GITHUB_TOKEN` is read-only by default, and the last step creates a Release.
    # The minimum permission is declared explicitly: writing repository contents,
    # and nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version is already on crates.io
        # A tag may be moved to a rewritten commit, and that push fires this
        # workflow again. Publishing is irreversible, so the job has to treat
        # "this version already exists" as nothing to do rather than as a
        # failure. The tag was already checked against Cargo.toml in `verify`.
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -o /dev/null "https://crates.io/api/v1/crates/qualia2fa-ffi/${version}"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::qualia2fa-ffi ${version} is already published, skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # The token comes from a repository secret and is injected only in the
        # publishing step -- the verification jobs do not need it, so it must not
        # appear in their environment.
        if: steps.registry.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_KEY }}
        run: cargo publish --locked

      - name: Tag the published commit
        # This step is reached only when `cargo publish` has **already succeeded**
        # (a failing previous step aborts the job).
        #
        # # This step deliberately omits `set -e`
        #
        # Publishing is **irreversible**, so "already on crates.io, but the GitHub
        # Release was not created" must never turn the whole job red -- that would
        # read as a failed publishing run.
        #
        # The failure is therefore downgraded to a **warning**, and it only affects
        # whether that Release exists on GitHub, which is purely cosmetic.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release create "$GITHUB_REF_NAME" \
               --title "$GITHUB_REF_NAME" \
               --notes "Published to crates.io as \`qualia2fa-ffi\`." \
               --verify-tag; then
            echo "Created GitHub Release $GITHUB_REF_NAME"
          else
            echo "::warning::the crate reached crates.io, but creating the GitHub Release failed (usually a missing contents: write permission). The publishing result is unaffected."
          fi
