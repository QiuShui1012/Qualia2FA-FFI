[package]
name = "qualia2fa-ffi"
version = "0.1.0"
edition = "2024"
description = "Qualia2FA 的 FFI 层：把 qualia2fa-core 暴露为 UniFFI 绑定，供 Kotlin/Swift 等调用"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Qualia2FA/Qualia2FA-FFI"
readme = "README.md"
publish = false

# ⚠️ 本 crate **不能** 加 `#![forbid(unsafe_code)]`。
#
# `uniffi::setup_scaffolding!()` 在当前 crate 内展开 FFI 边界所需的 unsafe 代码
# （裸指针解引用、`catch_unwind`、字符串所有权转移）。这是不可协商的：FFI 边界
# 本身就是 unsafe 的，安全性由 UniFFI 的生成代码与我们的 `Result` 返回约定来保证。
#
# 安全边界因此划在 crate 之间而非模块之间：
#   - qualia2fa-core：无 I/O、无 unsafe（`forbid(unsafe_code)`）、可独立审计
#   - qualia2fa-ffi ：唯一允许 unsafe 的地方，且只应包含「搬运」逻辑
# 审查本仓库时，注意力应集中在「有没有把核心的逻辑搬到这里来」——
# 任何加密或解析逻辑出现在本 crate 里都是设计倒退。
[lints.rust]
unsafe_code = "warn"

[lib]
# cdylib 供 JVM（JNA）/Android/iOS 动态加载；staticlib 供 iOS 静态链接与
# 需要把整个库塞进单一产物的场景。两者都产出，由各平台按需取用。
crate-type = ["cdylib", "staticlib"]

[dependencies]
# 核心库的路径**必须**写成 `Core`（不带 `../`）。
#
# `../Core` 的解析基准不是本清单所在目录，而是**外层仓库之上**：
# 本地 `Qualia2FA/FFI/Cargo.toml` 里写 `../Core` 恰好命中 `Qualia2FA/Core`
# 所以看不出问题，但在 CI 上仓库被检出到 `D:\a\Qualia2FA-FFI\Qualia2FA-FFI\`，
# 于是 `../Core` 指向 `D:\a\Qualia2FA-FFI\Core`——该目录不存在，构建失败：
#   failed to read `D:\a\Qualia2FA-FFI\Core\Cargo.toml`
#
# 不带前缀的 `Core` 则稳定地解析到「仓库内的 Core/」，在本地与 CI 上一致：
#   - 本地：`Qualia2FA/Main/Core`（本仓库作为 submodule 被引入后）
#   - CI  ：`<仓库根>/Core`（由 .github/workflows/ci.yml 显式检出）
qualia2fa-core = { path = "Core" }

# 设备身份：`DevicePublicKey` / `DeviceSignature` 的类型与解析都在这里。
#
# # 为什么本 crate 直接依赖它，而 Core 也依赖它
#
# FFI 层要把端侧回调（`FfiDeviceKeys::get_or_create` / `sign`）返回的**裸字节**转成
# 类型化的值，而那两个类型定义在设备身份库（`qualia-dik`）里，不在 Core 里。Core 只是
# **再导出**它们以便下游少写一个依赖；在 FFI 这层，回调的签名直接用原类型更清楚——
# 再导出是给「只依赖 Core 的调用方」用的便利，不是要求。
#
# 路径与 Core 用的**同一条**（`../QualiaDeviceIdentityKit`），因为它与 Core 是同级
# 目录。这一点必须在 CI 里成立：workflow 会把两个仓库都检出到同级位置。
qualia-dik = { path = "../QualiaDeviceIdentityKit" }

# 用于 `FfiError` 的 `Display` 与 `std::error::Error` 实现。
# 与核心同一个 major（2.0.21），不会引入重复版本。
thiserror = "2"

# UniFFI 版本策略（见 TODO.md §4.4）：
#
# 上游最新是 0.32.2，但我们**刻意停在 0.29.x**——端的绑定生成器 Gobley
# 强制 `uniffi = "0.29.4"`，Rust 侧与 Kotlin 侧的脚手架必须同版本，否则
# 生成的序列化格式不匹配。
#
# 取 `0.29`（等价 `^0.29`，即 >=0.29.0 <0.30.0）而非写死 `=0.29.4`：
# 0.29.5 已发布（2025-11-14，含修复），同 minor 内 semver 兼容。
# 这样既能吃到 0.29 线的补丁，又不会跨到 0.30。
#
# `cli` 特性提供 `uniffi::uniffi_bindgen_main`，供 `src/bin/uniffi-bindgen.rs`
# 使用。它**必须在 `[dependencies]` 而非 `[dev-dependencies]`**：
# dev-dependencies 的特性只对 test/example/bench 目标生效，对 `src/bin/` 下的
# 二进制**不生效**——放在 dev 段会导致 `cargo build --bin uniffi-bindgen` 时
# uniffi 以 `features=cargo-metadata,default` 编译，`uniffi_bindgen_main`
# 找不到（实测报 E0425）。
#
# 代价是 clap/camino 进入本 crate 的依赖树，但它们**只被那个生成绑定的二进制
# 使用**，不会被链接进 cdylib/staticlib，因此不影响端侧产物的体积。
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
# 测试需要一个**真实的** ECDSA P-256 实现来扮演端侧设备身份，以及一个 SHA-256 来
# 从标签确定性地导出测试私钥。
#
# 版本与核心库固定的一致：`p256 0.14`（0.13 依赖 `sha2 ^0.10`，会拖进第二份
# SHA-2，而核心已经固定 0.14）。保持同一版本意味着测试跑在与生产同一条代码路径上，
# 且锁文件里不会出现两份 `p256`/`sha2`。
#
# 这两项**只进测试目标**，不会链接进 cdylib/staticlib。
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
