[package]
name = "qualia2fa-ffi"
version = "0.1.0"
edition = "2024"
description = "Qualia2FA FFI layer: exposes qualia2fa-core as UniFFI bindings for Kotlin and Swift"
license = "LGPL-3.0-or-later"
rust-version = "1.89"
repository = "https://github.com/Qualia2FA/Qualia2FA-FFI"
readme = "README.md"
# CI configuration and the dependency audit manifest are not part of the published
# package: they are meaningless to users, and the size and contents of a crates.io
# package are publicly visible.
exclude = ["/.github", "/deny.toml"]

# This crate must **not** enable `#![forbid(unsafe_code)]`.
#
# `uniffi::setup_scaffolding!()` expands the unsafe code required at the FFI
# boundary: raw pointer dereference, `catch_unwind`, string ownership transfer.
# The boundary is inherently unsafe.
#
# Soundness rests on the generated UniFFI code and on the `Result` return
# convention, so the safety boundary is drawn between crates, not modules:
#   - qualia2fa-core: no I/O, no unsafe (`forbid(unsafe_code)`), auditable alone
#   - qualia2fa-ffi : the only place unsafe is allowed, marshalling logic only
# No cryptography or parsing logic belongs in this crate.
#
# `unsafe_code = "warn"` keeps new unsafe code visible; CI raises it to an error
# with `-D warnings`.
[lints.rust]
unsafe_code = "warn"

[lib]
# cdylib is loaded dynamically by the JVM (JNA), Android and iOS; staticlib
# serves iOS static linking and single-artifact builds. Both are produced.
#
# No rlib is produced, so integration tests under `tests/` cannot link this crate:
# all tests are `#[cfg(test)] mod tests` inside `src/lib.rs`.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# A version dependency on the core library, which is published on crates.io as
# `qualia2fa-core 0.1.0`. Local builds, CI and third-party consumers therefore
# resolve the same source, and this repository checks nothing out: the nested
# `Core/` submodule was removed together with the path dependency.
qualia2fa-core = "0.1.0"

# Device identity: the `DevicePublicKey` / `DeviceSignature` types live here.
#
# The host callbacks (`FfiDeviceKeys::get_or_create` / `sign`) return raw bytes.
#
# The FFI layer converts those bytes into the types above. Core re-exports them
# so that callers depending on Core alone need one dependency less; this crate
# uses the original types directly, since the callback signatures are clearer
# with them.
#
# A version requirement, matching the version Core uses.
#
# The crate is published on crates.io as `qualia-dik 0.1.0`, which puts local,
# CI and third-party consumers on the same source. Both this crate and Core
# depend on it directly.
qualia-dik = "0.1"

# Provides the `Display` and `std::error::Error` implementations of `FfiError`.
# Same major as the version Core uses (2.0.21), so no duplicate version.
thiserror = "2"

# UniFFI version policy:
#
# Pinned to an exact patch, not to the `0.29` line: the application-side binding
# generator Gobley 0.3.7 (2025-10-08, its newest release) generates its bindings
# against 0.29.4, and the Rust and Kotlin scaffolding must be the same patch
# release or the generated serialization format differs. A caret requirement
# would resolve to 0.29.5 from the registry, which is that mismatch.
#
# The `cli` feature provides `uniffi::uniffi_bindgen_main`, used by
# `src/bin/uniffi-bindgen.rs`. It must sit in `[dependencies]`, not in
# `[dev-dependencies]`: dev-dependency features apply to test, example and
# bench targets only, never to targets under `src/bin/`, so in the dev
# section the entry point is missing and `cargo build --bin uniffi-bindgen`
# finds no `uniffi_bindgen_main`.
#
# clap and camino therefore enter this crate's dependency tree for that binary
# only, and are not linked into cdylib/staticlib.
uniffi = { version = "=0.29.4", features = ["cli"] }

[dev-dependencies]
# The tests need a real ECDSA P-256 implementation to play the host device
# identity, and a SHA-256 to derive test private keys deterministically.
#
# `p256 0.14` matches the version Core pins; 0.13 depends on `sha2 ^0.10` and
# would pull in a second SHA-2. Staying on the same version keeps the tests on
# the production code path and the lockfile down to one `p256`/`sha2`.
#
# Both are test-target only and are not linked into cdylib/staticlib.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
