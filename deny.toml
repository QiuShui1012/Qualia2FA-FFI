# cargo-deny configuration.
#
# Dependency policy: the RustSec database gained 334 advisories in 2026, and
# every severe upstream issue was fixed in a patch or minor release.
#
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# This file differs from `Core/deny.toml`, which is the stricter of the two.
#
# The two crates are used differently, so their license boundaries differ:
#
# - `qualia2fa-core` is a **library** published under LGPL-3.0-or-later and
#   linked by other projects, so its dependencies must coexist with **any** downstream license.
# - `qualia2fa-ffi` is **part of the application**, statically linked by Qualia2FA
#   itself and not distributed on its own, so it accepts a different dependency set.
#
# Each file therefore lists its own side explicitly; the library side stays
# the stricter one.

[graph]
# Evaluate dependencies per target platform, so platform-specific dependencies
# are not counted against the wrong build; the application ships on these three.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
    { triple = "aarch64-apple-ios" },
]
all-features = true

[advisories]
# Any unhandled vulnerability fails the check: `vulnerability` is a hard failure
# and is not deferred.
version = 2
ignore = [
    # Advisories that must be accepted temporarily belong here, with a reason and an expiry date:
    # { id = "RUSTSEC-0000-0000", reason = "no reachable path, await upstream 0.3.x (review: 2026-12-31)" },
]

[licenses]
version = 2
# An explicit list rather than "allow every OSI-approved license": the latter
# stays green when a new dependency arrives under an OSI-approved copyleft
# license, while this list turns that into a failure someone has to review.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    # `r-efi` (UEFI support tables on Windows) is LGPL-2.1-or-later, which is
    # compatible with this project's LGPL-3.0-or-later: LGPL-3.0 section 3 allows
    # an earlier LGPL version to be upgraded to this one.
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    # The uniffi family and Gobley are MPL-2.0 (file-level copyleft, compatible with LGPL).
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Fail explicitly on a license outside the list instead of accepting it silently.
confidence-threshold = 0.9

# The allow list covers stacks that are not in use yet, so some entries match no
# dependency today; unmatched allow entries are therefore allowed.
unused-allowed-license = "allow"

# If a dependency's license cannot be detected automatically (for example a
# bundled LICENSE file without an SPDX declaration), clarify its actual license here:
#
# [[licenses.clarify]]
# crate = "some-crate"
# expression = "MIT"
# license-files = [{ path = "LICENSE", hash = 0x0000_0000 }]

[bans]
multiple-versions = "warn"
# Warn when a dependency appears in several versions (important for crypto
# crates: two versions of `aes` may mean one of them is unpatched).
wildcards = "deny"
# Allow version-less **path dependencies**, as used for the core library below.
#
# This crate depends on the core library as `qualia2fa-core = { path = "Core" }`,
# where a version requirement would be ignored by Cargo: the wildcard is
# inherent to path dependencies. `foo = "*"` from crates.io is still denied.
allow-wildcard-paths = true
#
# Known duplicate versions: `syn` 2.0.119 and 3.0.7 coexist because the uniffi
# macro chain pins different major versions. It is a **warning**, not a failure,
# and both are proc-macro dependencies that do not enter the artifacts.
# Explicitly denied crates, with the reason for each:
deny = [
    # Upstream PQClean is archived; RUSTSEC-2026-0164 marks it unmaintained.
    { name = "pqcrypto" },
    { name = "pqcrypto-kyber" },
    { name = "pqcrypto-dilithium" },
    # The AVX2 backend skips the Fujisaki-Okamoto implicit rejection, breaking the CCA proof.
    { name = "pqc_kyber" },
    { name = "cosmian_kyber" },
    # Hybrid KEM at the pre-verification stage implementing an old draft; 21 advisories in 10 months.
    { name = "libcrux-kem" },
    { name = "libcrux-aesgcm" },
    # CPace: no usable implementation in the Rust ecosystem.
    { name = "cpace" },
    { name = "pake-cpace" },
    # Merged into `aes`.
    { name = "aes-soft" },
    { name = "aesni" },
    # `iroh` 1.0 and later ship RFC 10024 X25519MLKEM768 themselves; this crate is
    # the older approach to the same thing and conflicts with the rustls KEM group
    # selection, registering the same named group twice.
    { name = "rustls-post-quantum" },
]

# Note: `anyhow` is not denied. It is a library API-style concern, since public
# signatures use thiserror; denying it would also hit dev-dependencies and build scripts.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `allow-git` is empty: the project currently depends on no git sources.
allow-git = []
